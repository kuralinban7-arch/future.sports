<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Future Sports</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="icon" type="image/png" href="brand/favicon.png">
  <link rel="apple-touch-icon" href="brand/apple-touch-icon.png">
  <link rel="stylesheet" href="css/style.css?v=202611262010">
</head>
<body>
  <div id="header"></div>

  <main>
    <div class="container">
      <div class="crumbs" style="padding-top:28px" id="crumbs"></div>
      <div class="pdp" id="pdp"></div>
    </div>

    <!-- ═════════ INSPECT EVERY DETAIL (sticks only) ═════════ -->
    <section class="sec sec-tint" id="inspect" hidden>
      <div class="container">
        <div class="sec-head">
          <div>
            <span class="kicker"><i></i>Interactive Inspection</span>
            <h2 class="big-title" data-scramble>Inspect <span class="dim">every detail.</span></h2>
            <p class="lead" id="inspectLead"></p>
          </div>
        </div>
        <div class="inspect" id="inspectBox"></div>
      </div>
    </section>

    <!-- ═════════ BUILT FROM THE FIBRE UP (sticks only) ═════════ -->
    <section class="sec" id="technology" hidden>
      <div class="container">
        <div class="fibre-solo">
          <div>
            <span class="kicker"><i></i>Engineering</span>
            <h2 class="big-title" data-scramble>Built from <span class="dim">the fibre up.</span></h2>
            <p class="lead" id="fibreLead"></p>
          </div>
          <div class="gauge-row">
            <div class="gauge">
              <svg viewBox="0 0 120 120"><circle cx="60" cy="60" r="52" class="g-track"/><circle cx="60" cy="60" r="52" class="g-fill"/></svg>
              <div><strong>0%</strong><span>Carbon fibre</span></div>
            </div>
            <div class="fibre-bars"></div>
          </div>
        </div>
        <div class="tech-cards"></div>
      </div>
    </section>

    <div class="container">
      <section class="pdp-related">
        <div class="section-head">
          <div><span class="eyebrow" id="relEyebrow">Same Series</span><h2 class="display">You May Also <em>Like</em></h2></div>
        </div>
        <div class="product-grid" id="related"></div>
      </section>
    </div>
  </main>

  <div id="footer"></div>

  <script src="api/prices.js"></script>
  <script src="js/products.js?v=202611262010"></script>
  <script src="js/store.js?v=202611262010"></script>
  <script src="js/fx.js?v=202611262010"></script>
  <script src="js/inspect.js?v=202611262010"></script>
  <script>
    const p = getProduct(qs('id')) || PRODUCTS[0];
    const cat = getCategory(p.category);
    const sub = getSub(p.category, p.sub);                     // slot inside a main slot, e.g. Sports Wear › Shorts
    const isStick = /hockey-sticks$/.test(p.category);        // composite or wooden stick
    const has3D = !!inspectViews(p);                           // upright front/back cutouts exist
    const sizes = sizesOf(p);
    const priced = hasPrice(p);
    const buyable = canBuy(p);   // priced and in stock
    const oneSize = sizes.length === 1;
    renderShell(p.series ? p.series.toLowerCase() : 'cat');
    document.title = `${p.name}${p.carbon ? ` — ${p.carbon}% Carbon` : ''} | Future Sports`;
    document.documentElement.style.setProperty('--p-accent', p.accent);

    const sel = { variant: 0, size: sizes[0], bow: p.bows ? p.bows[0] : '', qty: 1, img: 0 };
    const brand = p.brand ?? (p.series && SERIES[p.series] ? SERIES[p.series].brand : 'SNS');   // '' = no brand on the product
    // what goes on the cart line / order: length and, for Alfa, the bow shape
    const choice = () => [oneSize ? '' : sel.size, sel.bow].filter(Boolean).join(' · ');

    document.getElementById('crumbs').innerHTML =
      `<a href="index.html">Home</a> / <a href="shop.html?cat=${p.category}">${cat.name}</a> / ` +
      (sub ? `<a href="shop.html?cat=${p.category}&sub=${sub.id}">${sub.name}</a> / ` : '') +
      (sub && sub.byBrand && p.brand ? `<a href="shop.html?cat=${p.category}&sub=${sub.id}&brand=${encodeURIComponent(p.brand)}">${p.brand}</a> / ` : '') +
      (p.series ? `<a href="shop.html?series=${p.series}">${seriesName(p.series)}</a> / ` : '') + p.name;

    const compRows = p.composition ? Object.entries(p.composition).map(([k, v]) => `
      <div class="comp-row"><div class="lbl"><span>${k === 'Glass' ? 'Glassfibre' : k === 'Carbon' ? 'Carbon Fibre' : k}</span><b>${v}%</b></div>
      <div class="track"><i class="${COMP_CLASS[k]}" style="width:${v}%"></i></div></div>`).join('') : '';

    const specRows = {
      Category: slotLabel(p),
      ...(p.series ? { Series: seriesName(p.series) } : {}),
      ...(p.carbon ? { 'Carbon Content': p.carbon + '%' } : {}),
      ...(p.composition ? { Composition: Object.entries(p.composition).map(([k, v]) => `${v}% ${k}`).join(', ') } : {}),
      ...(oneSize ? {} : { Sizes: sizes.join(' / ') }),
      ...(p.bows ? { 'Bow shapes': p.bows.join(' / ') } : {}),
      ...(p.specs || {}),
      ...(p.variants ? { Colours: p.variants.map(v => v.name).join(', ') } : {}),
    };

    const STICK_FIT = {
      '36"': `Players roughly 5'3" – 5'7" (160 – 170 cm)`,
      '36.5"': `Players roughly 5'5" – 5'10" (165 – 178 cm)`,
      '37"': `Players roughly 5'7" – 5'11" (170 – 180 cm)`,
      '37.5"': `Players roughly 5'10" and taller (178 cm+)`,
      '38"': `Players roughly 5'11" and taller (180 cm+)`,
      '38.5"': `Players roughly 6'0" and taller (183 cm+)`,
    };
    const BOW_FIT = {
      'Low Bow': 'puts the curve near the head, for drag flicks and aerials.',
      'Mid Bow': 'sits in the middle, an all-round shape for every position.',
      'Extreme Low Bow': 'puts the curve even closer to the head, mainly for drag flicks.',
    };
    const sizeGuide = isStick ? `
      <table class="spec-table">
        ${sizes.map(s => `<tr><td>${s}</td><td>${STICK_FIT[s] || ''}</td></tr>`).join('')}
      </table>
      ${p.bows ? `<p style="margin-top:12px;font-size:.8rem">${p.bows.map(b => BOW_FIT[b] ? `<b>${b}</b> ${BOW_FIT[b]}` : '').filter(Boolean).join(' ')}</p>` : ''}
      <p style="margin-top:12px;font-size:.8rem">The stick should reach about the top of your hip bone when standing upright.</p>`
      : `<p>Available in ${sizes.join(', ')}.${p.category === 'hockey-gloves' ? ' Choose the size you normally wear in sports gloves.' : ''}</p>`;

    document.getElementById('pdp').innerHTML = `
      <div class="gallery${p.tall ? ' tall' : ''}">
        <div class="main">
          ${p.badge ? `<span class="badge">${p.badge}</span>` : ''}
          <img id="mainImg" alt="${p.name}">
        </div>
        <div class="thumbs" id="thumbs"></div>
        ${has3D ? `<a href="#inspect" class="inspect-link"><svg viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 4v5h-5"/></svg>Inspect in 3D</a>` : ''}
      </div>

      <div class="pdp-info">
        <span class="eyebrow">${p.series ? seriesTitle(p) : slotLabel(p)}</span>
        <h1 class="display">${p.name}</h1>
        <span class="tag">${p.carbon ? p.carbon + '% Carbon' : p.tagline || ''}</span>
        <span class="price ${priced ? '' : 'tba'}">${priceLabel(p)}</span>
        ${p.bulk ? `<span class="bulk-note">${bulkNote(p)}</span>` : ''}
        <span class="stock ${buyable ? '' : 'out'}">${!inStock(p) ? 'Out of stock' : priced ? 'In stock' : 'Available soon'}</span>
        <p class="desc">${p.description}</p>

        ${p.variants ? `
          <div class="opt-label"><span>Colour</span><span id="variantName">${p.variants[0].name}</span></div>
          <div class="variant-row" id="variants">
            ${p.variants.map((v, i) => `<button class="variant ${i === 0 ? 'active' : ''}" data-i="${i}" title="${v.name}" aria-label="${v.name}" style="--sw:${v.swatch}"></button>`).join('')}
          </div>` : ''}

        ${oneSize ? '' : `
        <div class="opt-label"><span>${isStick ? 'Length' : 'Size'}</span><span class="muted">Size guide below</span></div>
        <div class="sizes" id="sizes">
          ${sizes.map((s, i) => `<button class="size-btn ${i === 0 ? 'active' : ''}" data-s='${s}'>${s}</button>`).join('')}
        </div>`}

        ${p.bows ? `
        <div class="opt-label"><span>Bow</span><span class="muted" id="bowName">${p.bows[0]}</span></div>
        <div class="sizes" id="bows">
          ${p.bows.map((b, i) => `<button class="size-btn ${i === 0 ? 'active' : ''}" data-b="${b}">${b}</button>`).join('')}
        </div>` : ''}

        <div class="buy-row">
          <div class="qty"><button id="qMinus" aria-label="Decrease">−</button><span id="qVal">1</span><button id="qPlus" aria-label="Increase">+</button></div>
          <button class="btn btn-accent" id="addBtn" ${buyable ? '' : 'disabled'}>${buyable ? `Add to Cart · <span id="addTotal">${money(p.price)}</span>` : !inStock(p) ? 'Out of stock' : priceLabel(p)}</button>
        </div>
        <button class="btn btn-block" id="buyNow" ${buyable ? '' : 'disabled'}>Buy It Now</button>
        ${waLink() ? `<a class="wa-ask" id="waAsk" target="_blank" rel="noopener">${ICON.wa}<span>Ask about this on WhatsApp</span></a>` : ''}

        <div class="assure">
          <div>${ICON.truck}Free shipping on orders over ${money(STORE.freeShippingOver)}</div>
          <div>${ICON.swap}Cash on delivery available</div>
          ${brand ? `<div>${ICON.shield}Genuine ${brand} product</div>` : ''}
        </div>

        <div class="accordion">
          ${p.tech && p.tech.length ? `
          <details class="acc-item" open>
            <summary>Technology</summary>
            <div class="acc-body tech-list">
              ${p.tech.map(k => `<div><span class="code">${k}</span><span><strong>${TECH[k].name}</strong>${TECH[k].desc}</span></div>`).join('')}
            </div>
          </details>` : ''}
          ${p.composition ? `
          <details class="acc-item" open>
            <summary>Material Composition</summary>
            <div class="acc-body comp-rows">${compRows}</div>
          </details>` : ''}
          <details class="acc-item" ${isStick ? '' : 'open'}>
            <summary>Specifications</summary>
            <div class="acc-body"><table class="spec-table">${Object.entries(specRows).map(([k, v]) => `<tr><td>${k}</td><td>${v}</td></tr>`).join('')}</table></div>
          </details>
          ${oneSize ? '' : `
          <details class="acc-item">
            <summary>Size Guide</summary>
            <div class="acc-body">${sizeGuide}</div>
          </details>`}
        </div>
      </div>`;

    // WhatsApp question about this exact product / colour / size
    function updateWa() {
      const el = document.getElementById('waAsk');
      if (!el) return;
      const opts = [p.variants ? p.variants[sel.variant].name : '', choice()].filter(Boolean).join(', ');
      el.href = waLink(`Hi Future Sports, I'm interested in the ${p.name}${opts ? ` (${opts})` : ''}${priced ? ` - ${priceLabel(p)}` : ''}.${!inStock(p) ? ' Is it back in stock?' : ''} ${location.href}`);
    }
    updateWa();
    document.addEventListener('click', e => { if (e.target.closest('#variants, #sizes, #bows')) setTimeout(updateWa, 0); });

    // gallery
    function drawGallery() {
      const list = productImages(p, sel.variant);
      sel.img = Math.min(sel.img, list.length - 1);
      const main = document.getElementById('mainImg');
      main.src = list[sel.img];
      document.getElementById('thumbs').innerHTML = list.map((src, i) =>
        `<button class="${i === sel.img ? 'active' : ''}" data-i="${i}" aria-label="View image ${i + 1}"><img src="${src}" alt=""></button>`).join('');
      document.querySelectorAll('#thumbs button').forEach(b => b.onclick = () => { sel.img = +b.dataset.i; drawGallery(); });
    }
    drawGallery();

    // variant
    document.querySelectorAll('#variants .variant').forEach(b => b.onclick = () => {
      sel.variant = +b.dataset.i; sel.img = 0;
      document.querySelectorAll('#variants .variant').forEach(x => x.classList.toggle('active', x === b));
      document.getElementById('variantName').textContent = p.variants[sel.variant].name;
      drawGallery();
      if (inspect) inspect.setVariant(sel.variant);
    });

    // size
    document.querySelectorAll('#sizes .size-btn').forEach(b => b.onclick = () => {
      sel.size = b.dataset.s;
      document.querySelectorAll('#sizes .size-btn').forEach(x => x.classList.toggle('active', x === b));
    });

    // bow shape (Alfa sticks)
    document.querySelectorAll('#bows .size-btn').forEach(b => b.onclick = () => {
      sel.bow = b.dataset.b;
      document.querySelectorAll('#bows .size-btn').forEach(x => x.classList.toggle('active', x === b));
      document.getElementById('bowName').textContent = sel.bow;
    });

    // qty
    function setQty(n) {
      sel.qty = Math.max(1, Math.min(maxQty(p), n));
      document.getElementById('qVal').textContent = sel.qty;
      if (buyable) document.getElementById('addTotal').textContent = money(unitPrice(p, sel.qty) * sel.qty);
    }
    document.getElementById('qMinus').onclick = () => setQty(sel.qty - 1);
    document.getElementById('qPlus').onclick = () => setQty(sel.qty + 1);

    const add = () => Cart.add(p.id, { variant: p.variants ? sel.variant : null, size: choice() || sel.size, qty: sel.qty });
    const label = () => [p.variants && p.variants.length > 1 ? p.variants[sel.variant].name : '', choice()].filter(Boolean).join(', ');
    document.getElementById('addBtn').onclick = () => { if (add()) toast(`${p.name}${label() ? ` (${label()})` : ''} added to cart`, true); };
    document.getElementById('buyNow').onclick = () => { if (add()) location.href = 'checkout.html'; };

    // inspect + fibre sections, same as the Blade 7 on the home page
    let inspect = null;
    if (has3D) {
      document.getElementById('inspect').hidden = false;
      document.getElementById('inspectLead').textContent =
        `Turn the ${p.name} in your hands. Drag the stick to spin it, then select a point to move in on the materials and technologies that shape how it plays.`;
      inspect = mountInspect(document.getElementById('inspectBox'), p, sel.variant);
    }
    if (p.composition) {   // the fibre gauge needs a known fibre mix
      document.getElementById('technology').hidden = false;
      document.getElementById('fibreLead').textContent = fibreLead(p);
      mountFibre(document.getElementById('technology'), p);
    }

    // related: same series (nearest carbon) for sticks, same category otherwise
    const related = (p.series
      ? PRODUCTS.filter(x => x.series === p.series && x.id !== p.id).sort((a, b) => Math.abs(a.carbon - p.carbon) - Math.abs(b.carbon - p.carbon))
      : PRODUCTS.filter(x => x.category === p.category && x.id !== p.id)
    ).slice(0, 4);
    const fill = related.length ? related : PRODUCTS.filter(x => x.featured !== false && x.carbon && x.id !== p.id).slice(5, 9);
    document.getElementById('relEyebrow').textContent = related.length ? `More ${p.series || cat.name}` : 'Composite Hockey Sticks';
    document.getElementById('related').innerHTML = fill.map(productCard).join('');
    initReveal();
  </script>
</body>
</html>
